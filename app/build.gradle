plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.yasn198020.aicontrol'
    compileSdk 35
    ndkVersion '29.0.13113456'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    defaultConfig {
        applicationId 'com.yasn198020.aicontrol'
        minSdk 26
        targetSdk 35
        versionCode project.findProperty("VERSION_CODE")?.toString()?.toInteger() ?: 1000
        versionName project.findProperty("VERSION_NAME")?.toString() ?: "2.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                          '-DBUILD_SHARED_LIBS=ON',
                          '-DLLAMA_BUILD_COMMON=ON',
                          '-DLLAMA_BUILD_APP=OFF',
                          '-DLLAMA_OPENSSL=OFF',
                          '-DGGML_NATIVE=OFF',
                          '-DGGML_BACKEND_DL=ON',
                          '-DGGML_CPU_ALL_VARIANTS=ON',
                          '-DGGML_CPU_KLEIDIAI=ON',
                          '-DGGML_OPENMP=OFF',
                          '-DGGML_LLAMAFILE=OFF'
                targets 'marfa_llama',
                        'ggml-cpu-android_armv8.0_1',
                        'ggml-cpu-android_armv8.2_1',
                        'ggml-cpu-android_armv8.2_2',
                        'ggml-cpu-android_armv8.6_1',
                        'ggml-cpu-android_armv9.0_1',
                        'ggml-cpu-android_armv9.2_1',
                        'ggml-cpu-android_armv9.2_2'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
            }
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // Local GGUF inference for Gemma/llama.cpp; the app now also builds its own arm64 JNI backend.
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
