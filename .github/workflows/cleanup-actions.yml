name: Cleanup Actions history

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-actions.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[cleanup-actions]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel old active workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status] | @tsv' > /tmp/runs.tsv

          while IFS=$'\t' read -r RUN_ID STATUS; do
            [ -z "${RUN_ID}" ] && continue
            [ "${RUN_ID}" = "${CURRENT_RUN_ID}" ] && continue

            case "${STATUS}" in
              completed)
                ;;
              *)
                echo "CANCEL run ${RUN_ID} (${STATUS})"
                gh api --method POST \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel" >/dev/null 2>&1 || true
                ;;
            esac
          done < /tmp/runs.tsv

      - name: Wait for old runs to stop
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 20); do
            PENDING=$(gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID} and .status != \"completed\") | .id")

            if [ -z "${PENDING}" ]; then
              echo "All other runs are no longer active."
              break
            fi

            echo "Still active: ${PENDING}"
            sleep 2
          done

      - name: Delete old completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID} and .status == \"completed\") | .id" > /tmp/completed_ids

          MAX_PARALLEL=20
          PIDS=()

          while IFS= read -r RUN_ID; do
            [ -z "${RUN_ID}" ] && continue

            echo "DELETE run ${RUN_ID}"
            (
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" >/dev/null 2>&1 || true
            ) &
            PIDS+=("$!")

            if [ "${#PIDS[@]}" -ge "${MAX_PARALLEL}" ]; then
              for PID in "${PIDS[@]}"; do
                wait "${PID}" || true
              done
              PIDS=()
            fi
          done < /tmp/completed_ids

          for PID in "${PIDS[@]}"; do
            wait "${PID}" || true
          done

          echo "Actions history cleanup finished."
