name: Android APK

on:
  push:
    branches:
      - main
      - android-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.$VERSION_CODE"

          gradle assembleDebug --no-daemon \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME"

          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ESP32-AI-Control-$VERSION_CODE-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ESP32-AI-Control-debug-latest.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-AI-Control-debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 90
